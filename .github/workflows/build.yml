name: Build Grab Editor

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish (single file, self-contained)
        run: >
          dotnet publish src/GrabEditor/GrabEditor.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o dist/GrabEditor

      - name: Download ffmpeg, yt-dlp and QuickJS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/GrabEditor/bin | Out-Null
          $retry = @{ MaximumRetryCount = 3; RetryIntervalSec = 5 }

          # ffmpeg "essentials" build: does all the cutting and exporting
          Invoke-WebRequest @retry "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          Copy-Item ffmpeg-tmp/*/bin/ffmpeg.exe dist/GrabEditor/bin/
          Copy-Item ffmpeg-tmp/*/bin/ffprobe.exe dist/GrabEditor/bin/

          # only used by "Import > From a link"
          Invoke-WebRequest @retry "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.exe" -OutFile dist/GrabEditor/bin/yt-dlp.exe
          Invoke-WebRequest @retry "https://github.com/quickjs-ng/quickjs/releases/latest/download/qjs-windows-x86_64.exe" -OutFile dist/GrabEditor/bin/qjs.exe

      # The artifact is "dist", so the downloaded zip contains the GrabEditor folder.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grab-Editor-portable
          path: dist

      - name: Zip (tagged releases only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path dist/GrabEditor -DestinationPath Grab-Editor-portable.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Grab-Editor-portable.zip
